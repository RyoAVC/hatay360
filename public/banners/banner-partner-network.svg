<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#142144" />
      <stop offset="100%" stop-color="#060c1c" />
    </linearGradient>
    <filter id="pnet-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-pnet)" />
  <circle cx="550" cy="220" r="160" fill="#6366f1" fill-opacity="0.2" filter="url(#pnet-glow)" />

  <!-- Network Map Nodes Stage -->
  <g stroke="#818cf8" stroke-opacity="0.3" stroke-width="2">
    <line x1="450" y1="120" x2="600" y2="180" />
    <line x1="600" y1="180" x2="520" y2="300" />
    <line x1="520" y1="300" x2="680" y2="310" />
    <line x1="600" y1="180" x2="710" y2="140" />
    <line x1="450" y1="120" x2="380" y2="240" />
  </g>

  <!-- Network Hub Glowing Circles -->
  <circle cx="600" cy="180" r="24" fill="#4f46e5" stroke="#a5b4fc" stroke-width="3" filter="url(#pnet-glow)" />
  <circle cx="600" cy="180" r="8" fill="#ffffff" />
  <text x="560" y="225" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">İskenderun Hub</text>

  <circle cx="450" cy="120" r="18" fill="#4338ca" stroke="#c7d2fe" stroke-width="2" />
  <text x="410" y="100" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Antakya</text>

  <circle cx="520" cy="300" r="18" fill="#4338ca" stroke="#c7d2fe" stroke-width="2" />
  <text x="485" y="335" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Dörtyol</text>

  <circle cx="680" cy="310" r="14" fill="#3730a3" stroke="#e0e7ff" stroke-width="2" />
  <text x="660" y="340" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Defne</text>

  <!-- Left Info Card -->
  <g transform="translate(60, 60)">
    <rect width="320" height="330" rx="22" fill="#000000" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    <g transform="translate(24, 28)">
      <rect width="130" height="24" rx="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" />
      <text x="12" y="16" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">💼 Yetkili Bayi Ağı</text>

      <text x="0" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">Bölgesel Temsilcilik</text>
      <text x="0" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">İskenderun &amp; Antakya Bölgesi</text>

      <g transform="translate(0, 105)">
        <rect width="272" height="52" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="14" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Kayıtlı İşletmeler</text>
        <text x="14" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">38 Aktif Esnaf</text>
      </g>

      <g transform="translate(0, 170)">
        <rect width="272" height="52" rx="12" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3" />
        <text x="14" y="24" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10">Sabit Komisyon Oranı</text>
        <text x="14" y="44" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="18" font-weight="900">%30 Net Hakediş</text>
      </g>
    </g>
  </g>
</svg>
