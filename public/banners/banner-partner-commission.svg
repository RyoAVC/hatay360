<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-pcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c14" />
      <stop offset="50%" stop-color="#0c3829" />
      <stop offset="100%" stop-color="#04120d" />
    </linearGradient>
    <filter id="pcom-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-pcom)" />
  <circle cx="600" cy="200" r="160" fill="#10b981" fill-opacity="0.25" filter="url(#pcom-glow)" />

  <!-- Center-Right 3D Earnings Stack -->
  <g transform="translate(440, 100)">
    <rect width="300" height="250" rx="20" fill="#000000" fill-opacity="0.5" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
    <g transform="translate(24, 30)">
      <text x="0" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">💰 Bu Ayki Net Hakediş</text>
      <text x="0" y="65" fill="#34d399" font-family="system-ui, sans-serif" font-size="34" font-weight="900">₺58.400</text>
      <rect y="85" width="250" height="32" rx="8" fill="#10b981" fill-opacity="0.15" />
      <text x="12" y="106" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">✓ Banka IBAN Hesabına Aktarıldı</text>

      <g transform="translate(0, 135)">
        <text x="0" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Yıllık Yenileme Pasif Geliri:</text>
        <text x="170" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="900">₺14.400 / Ay</text>
      </g>
    </g>
  </g>

  <!-- Left Info Card -->
  <g transform="translate(60, 80)">
    <rect width="340" height="290" rx="20" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <g transform="translate(26, 28)">
      <rect width="130" height="24" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
      <text x="12" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">💵 Yüksek Komisyon</text>

      <text x="0" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">Düzenli Aylık Kazanç</text>
      <text x="0" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Her Satıştan %30 Anında Nakit Pay</text>

      <g transform="translate(0, 110)">
        <text x="0" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">⚡ 5 Dakikada Otomatik Kurulum</text>
        <text x="0" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🏢 %100 White-Label Ajans Paneli</text>
        <text x="0" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">📁 Hazır Broşür ve Satış Kitleri</text>
      </g>
    </g>
  </g>
</svg>
