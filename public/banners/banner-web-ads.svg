<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04131a" />
      <stop offset="50%" stop-color="#07222e" />
      <stop offset="100%" stop-color="#030b10" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00a8c4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a8c4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00a8c4" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" />

  <!-- Cyber Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Glow Auras -->
  <circle cx="620" cy="180" r="140" fill="#00a8c4" fill-opacity="0.25" filter="url(#glow)" />
  <circle cx="200" cy="300" r="120" fill="#0891b2" fill-opacity="0.18" filter="url(#glow)" />

  <!-- 3D Browser Dashboard Window -->
  <g transform="translate(60, 45)">
    <!-- Window Outer Card -->
    <rect width="680" height="360" rx="20" fill="url(#card-glass)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="680" height="42" rx="20" fill="#000000" fill-opacity="0.4" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    
    <!-- URL Bar -->
    <rect x="80" y="10" width="340" height="22" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="96" y="25" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">🔒 https://antakyakunefecisi.hatay360.com</text>
    
    <!-- Status Badge -->
    <rect x="540" y="10" width="116" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
    <circle cx="554" cy="21" r="3.5" fill="#10b981" />
    <text x="566" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Yayında &amp; Canlı</text>

    <!-- Chart Area Inside Window -->
    <g transform="translate(30, 65)">
      <!-- Metric Cards Top -->
      <g transform="translate(0, 0)">
        <rect width="190" height="74" rx="14" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Google Ads Bütçe</text>
        <text x="16" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">₺14.200</text>
        <text x="16" y="64" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">4.8x ROAS Getiri</text>
      </g>

      <g transform="translate(205, 0)">
        <rect width="190" height="74" rx="14" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Aylık Ziyaretçi</text>
        <text x="16" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">4.820 Kişi</text>
        <text x="16" y="64" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">+%240 Arama Büyümesi</text>
      </g>

      <g transform="translate(410, 0)">
        <rect width="210" height="74" rx="14" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Gelen Form &amp; Arama</text>
        <text x="16" y="48" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="900">194 Talep</text>
        <text x="16" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Doğrudan WhatsApp / Tel</text>
      </g>

      <!-- SVG Line Chart Wave -->
      <g transform="translate(0, 95)">
        <rect width="620" height="175" rx="14" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
        
        <!-- Grid lines inside chart -->
        <line x1="20" y1="40" x2="600" y2="40" stroke="#ffffff" stroke-opacity="0.05" />
        <line x1="20" y1="85" x2="600" y2="85" stroke="#ffffff" stroke-opacity="0.05" />
        <line x1="20" y1="130" x2="600" y2="130" stroke="#ffffff" stroke-opacity="0.05" />

        <!-- Area Fill -->
        <path d="M 20 140 Q 90 120, 160 90 T 300 70 T 440 35 T 600 20 L 600 160 L 20 160 Z" fill="url(#chart-area)" />
        
        <!-- Line Curve -->
        <path d="M 20 140 Q 90 120, 160 90 T 300 70 T 440 35 T 600 20" fill="none" stroke="url(#cyan-glow)" stroke-width="4" stroke-linecap="round" />

        <!-- Glowing Nodes -->
        <circle cx="160" cy="90" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
        <circle cx="300" cy="70" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
        <circle cx="440" cy="35" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
        <circle cx="600" cy="20" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
      </g>
    </g>
  </g>
</svg>
