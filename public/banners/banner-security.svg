<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071520" />
      <stop offset="50%" stop-color="#0a2538" />
      <stop offset="100%" stop-color="#040d14" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00a8c4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="sec-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-sec)" />
  <circle cx="580" cy="220" r="170" fill="#00a8c4" fill-opacity="0.2" filter="url(#sec-glow)" />

  <!-- Holographic Shield 3D Center-Right -->
  <g transform="translate(560, 220)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00a8c4" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />
    <!-- Shield Path -->
    <path d="M 0 -60 L 50 -35 C 50 30, 0 65, 0 65 C 0 65, -50 30, -50 -35 Z" fill="url(#shield-grad)" fill-opacity="0.85" stroke="#ffffff" stroke-width="3" filter="url(#sec-glow)" />
    <!-- Lock Icon inside shield -->
    <rect x="-14" y="-8" width="28" height="24" rx="6" fill="#ffffff" />
    <path d="M -8 -8 L -8 -18 C -8 -25, 8 -25, 8 -18 L 8 -8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="0" cy="4" r="2.5" fill="#07222e" />
  </g>

  <!-- Left Glass Card Information -->
  <g transform="translate(70, 60)">
    <rect width="360" height="330" rx="22" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    
    <g transform="translate(26, 30)">
      <rect width="136" height="24" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
      <text x="12" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">🛡️ Kurumsal Güvence</text>

      <text x="0" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">256-Bit SSL &amp; E-İmza</text>
      <text x="0" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">5070 Sayılı Kanuna Uygun Resmi Altyapı</text>

      <g transform="translate(0, 105)">
        <rect width="308" height="48" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="14" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">✍️ Dijital E-İmza Arşivi</text>
        <text x="210" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">✓ Onaylı</text>
      </g>

      <g transform="translate(0, 165)">
        <rect width="308" height="48" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="14" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">📱 2FA İki Adımlı Giriş</text>
        <text x="235" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Aktif</text>
      </g>

      <g transform="translate(0, 225)">
        <rect width="308" height="44" rx="12" fill="#00a8c4" fill-opacity="0.12" stroke="#00a8c4" stroke-opacity="0.3" />
        <text x="14" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Bulut Sunucu Uptime: <tspan fill="#34d399" font-weight="bold">%99.98</tspan></text>
      </g>
    </g>
  </g>
</svg>
